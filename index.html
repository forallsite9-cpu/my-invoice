<style>
:root{--bg:#eceff2;--card:#fff;--ink:#161b22;--mut:#667085;--line:#d5dbe1;--acc:#0b6e78;--on:#fff;--am:#e9a21b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1317;--card:#181e25;--ink:#e8ecf0;--mut:#8f9aa6;--line:#2a323b;--acc:#3cc3cf;--on:#06262a}}
:root[data-theme="dark"]{--bg:#0f1317;--card:#181e25;--ink:#e8ecf0;--mut:#8f9aa6;--line:#2a323b;--acc:#3cc3cf;--on:#06262a}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h2{font:700 24px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0}
#app{max-width:720px;margin:auto;padding:14px 14px 96px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px}
label{display:block;font-size:12px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:3px}
button{font:inherit;font-weight:500;border:0;border-radius:8px;padding:10px 14px;background:var(--acc);color:var(--on);cursor:pointer}
button.g{background:transparent;color:var(--acc);border:1px solid var(--line)}
button.x{background:transparent;color:#c0392b;padding:6px 8px}
:focus-visible{outline:2px solid var(--am);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1.1fr .8fr 1fr;gap:8px;margin-top:8px}
.w2{grid-column:1/-1}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m{color:var(--mut);font-size:13px}.r{text-align:right}
.it{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-top:4px}
.due{background:#f6e2b3;color:#5a3d00}.ok{background:#cdeedd;color:#0b4a2a}
.st{display:flex;text-align:center}.st div{flex:1;font-size:12px;color:var(--mut)}.st b{display:block;font-size:17px;color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tt{border-left:4px solid var(--am)}.tt .sp{padding:2px 0}
label.up{display:inline-block;background:var(--acc);color:var(--on);padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:15px;margin:0}label.up.g{background:transparent;color:var(--acc);border:1px solid var(--line)}
.cd{border:1px dashed var(--line);border-radius:8px;padding:8px;margin-top:8px}
.sr{margin:0 0 10px}
details.card summary{cursor:pointer;padding:2px 0}
details details{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:14px 4px;border-top:3px solid transparent}
nav button.on{color:var(--acc);border-top-color:var(--am);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
#ov{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.bar{position:sticky;top:0;display:flex;gap:8px;padding:10px 14px;background:var(--bg);z-index:2}.bar select{width:auto;margin:0}
.sc{overflow-x:auto;padding:0 8px 24px}
.paper{background:#fff;color:#000;padding:14px;font:12px/1.4 Arial,sans-serif;min-width:560px;max-width:800px;margin:auto}
.paper table{width:100%;border-collapse:collapse}.paper td,.paper th{border:1px solid #000;padding:4px 6px;text-align:left;vertical-align:top}.paper .r{text-align:right}
@media print{#app,nav,.bar,#toast{display:none!important}#ov{position:static;background:#fff;overflow:visible;padding:0}.sc{overflow:visible;padding:0}:root{padding:0}}
</style></head>

    // 1. Browser ka original title save karein
    let oldTitle = document.title;
    
    // 2. Invoice no. aur Customer ka naam jodkar naya naam banayein
    // (Special characters jaise '/' ko '-' me badal dega taaki file save me error na aaye)
    let fileName = (D.no + ' ' + D.cust).replace(/[\\/:*?"<>|]+/g, '-').trim();
    
    // 3. Print command chalne se theek pehle page ka title change karein
    document.title = fileName || "Invoice";
    
    // 4. Print / PDF window open karein
    window.print();
    
    // 5. 2 second baad webpage ka title wapas normal (SlateBill) kar dein
    setTimeout(function() {
        document.title = oldTitle;
    }, 2000);
}

 const cu=`<details class="card"${oc?' open':''}><summary><b>Customers (${S.cust.length})</b></summary><p><button onclick="oc=1;S.cust.unshift({name:'New customer',person:'',mob:'',mail:'',pan:'',addr:''});save();draw(1)">+ Add customer</button></p>${S.cust.map((c,i)=>`<details${oc&&!i?' open':''}><summary>${esc(c.name)}</summary>${[['name','Company'],['person','Contact person'],['mob','Mobile'],['mail','E-mail'],['pan','PAN / GST'],['addr','Address']].map(([k,l])=>FL(c,k,l,`S.cust[${i}]`)).join('')}<button class="x" onclick="S.cust.splice(${i},1);save();draw(1)">Delete customer</button></details>`).join('')}</details>`;
 return`<div class="hd"><h2>Setup</h2></div><div class="card"><div class="sp"><b>Cloud sync (Google Drive)</b><span class="m" id="cst">${esc(cs)}</span></div>${gs?`<p class="m">Kisi bhi device par ye link kholkar yahi URL aur password daaloge to data sync hoga.</p><div class="acts"><button class="g" onclick="sync()">Sync now</button><button class="x" onclick="gdis()">Disconnect</button></div><details><summary class="m">Data alag-alag dikhe to</summary><div class="acts"><button class="x" onclick="fcm('up')">${fc=='up'?'Tap again: Drive ka data badlega':'Is device ka data Drive me daalo'}</button><button class="x" onclick="fcm('down')">${fc=='down'?'Tap again: is device ka data badlega':'Drive ka data is device par lao'}</button></div></details>`:`<p class="m">Apps Script web app ka URL aur password daalo.</p><label>Web app URL<input id="gu" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Password<input id="gk" type="password"></label><div class="acts"><button onclick="gcon()">Connect</button></div>`}</div>${bz}${cu}
<details class="card"><summary><b>Equipment items (${S.items.length})</b></summary><p class="m">Ek line = ek item, format: Name | Category<br>Categories: ${esc(S.cfg.rt.join(', '))}</p><textarea rows="12" onchange="S.items=this.value.split('\\n').map(s=>s.trim()).filter(Boolean).map(s=>{const k=s.lastIndexOf('|');return k<0?{n:s,c:''}:{n:s.slice(0,k).trim(),c:s.slice(k+1).trim()}});save();draw(1)">${esc(S.items.map(i=>i.n+' | '+i.c).join('\n'))}</textarea></details>
<details class="card"><summary><b>Numbering</b></summary>${FL(S.cfg,'invP','Invoice prefix','S.cfg')}${FL(S.cfg,'invS','Invoice suffix','S.cfg')}${FL(S.cfg,'recP','Receipt prefix','S.cfg')}${FL(S.cfg,'recS','Receipt suffix','S.cfg')}${FL(S.cfg,'title','Default invoice type','S.cfg')}${FL(S.cfg,'invT','Invoice heading (print)','S.cfg')}${FL(S.cfg,'reqT','Requirement heading (print)','S.cfg')}<p class="m">Suffix me {FY} likhoge to date se financial year (jaise 26-27) apne aap lagega. Khali chhodo to kuch nahi lagega.</p></details>
<details class="card"><summary><b>Backup / Restore</b></summary><p class="m">Data sirf is browser me save hota hai. "Save backup file" dabao aur share sheet me Google Drive (ya Files) chuno. Restore ke liye wahi file chuno.</p><div class="acts"><button onclick="bkp()">Save backup file</button><label class="up g">Restore from file<input type="file" accept=".json,application/json" hidden onchange="rf(this)"></label></div><details><summary class="m">Text se backup / restore</summary><textarea id="bk" rows="5"></textarea><div class="acts"><button class="g" onclick="$('#bk').value=JSON.stringify(S);$('#bk').select()">Show backup</button><button onclick="try{S=mig(JSON.parse($('#bk').value));save();draw();toast('Restored')}catch(e){toast('Backup text sahi nahi hai')}">Restore</button></div></details></details>`}
